# Repo-local hook definition (consumed when users pin this repo in
# .pre-commit-config.yaml with id: snapper). identify has no "org" type, so
# match by extension instead of types_or.
- id: snapper
  name: snapper
  description: Reformat prose with semantic line breaks (Org, LaTeX, Markdown, RST, plaintext)
  entry: snapper --in-place
  language: rust
  files: \.(org|tex|latex|md|markdown|rst|txt)$
