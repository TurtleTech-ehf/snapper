# Vale external action: run `snapper --check` for precise sentence-boundary
# enforcement. Requires `snapper` on PATH (see docs/howto/vale-integration).
#
# .vale.ini example:
#   StylesPath = path/to/snapper/vale
#   [*.{org,md,tex,rst}]
#   BasedOnStyles = snapper
#   snapper.SnapperCheck = YES
extends: script
message: "Needs semantic line breaks (run `snapper -i`)."
scope: raw
level: error
script: |
  #!/usr/bin/env bash
  set -euo pipefail
  file="${1:-}"
  if [ -z "$file" ] || [ ! -f "$file" ]; then
    exit 0
  fi
  if ! command -v snapper >/dev/null 2>&1; then
    echo "snapper not on PATH; install snapper or use the regex rules only"
    exit 0
  fi
  # Vale external actions expect line:column:message on stdout for violations.
  json="$(snapper --check --output-format json "$file" 2>/dev/null || true)"
  if [ -z "$json" ]; then
    exit 0
  fi
  if command -v python3 >/dev/null 2>&1; then
    printf '%s\n' "$json" | python3 -c '
import json, sys
try:
    data = json.load(sys.stdin)
except Exception:
    sys.exit(0)
if not isinstance(data, list):
    sys.exit(0)
for item in data:
    for d in item.get("diagnostics") or []:
        kind = d.get("kind") or "fused"
        if kind == "long":
            continue
        line = d.get("line") or 1
        excerpt = (d.get("excerpt") or "").replace("\n", " ")
        print(f"{line}:1:{kind}: {excerpt}")
'
  elif ! snapper --check "$file" >/dev/null 2>&1; then
    echo "1:1:file needs semantic line break formatting (snapper --check failed)"
  fi
