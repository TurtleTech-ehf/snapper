name: crates.io

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'src/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to publish (defaults to the triggering ref)'
        required: false
        type: string
      dry_run:
        description: 'Mint the token and package, but upload nothing'
        required: false
        default: true
        type: boolean

concurrency:
  group: crates-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  package:
    name: Verify crate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Builds the packaged tarball exactly as `cargo publish` would, so a
      # crate that cannot be consumed from the registry fails here rather
      # than after an irreversible upload.
      - name: Package
        run: cargo publish --dry-run --locked

  publish:
    name: Publish to crates.io
    needs: [package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment:
      name: crates-io
      url: https://crates.io/crates/snapper-fmt
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      # Trusted publishing: exchange this job's OIDC identity for a token
      # that lives only for the length of the run. crates.io accepts it
      # because the registry side pins this repository, this workflow file
      # and the environment below; a mismatch fails here rather than
      # reaching for a long-lived credential.
      - name: Mint a trusted-publishing token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked ${{ inputs.dry_run && '--dry-run' || '' }}
