name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default path is GHC-free. Feature `pandoc-colink` is never in default features;
# it requires native/snapper-pandoc/build-static.sh output (see native README).
# Optional static-colink builds are proven on linux builders with GHC installed;
# they are not part of PR gates so macOS/ubuntu runners stay green without Haskell.

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test (default features, no colink / no GHC)
        run: cargo test

      - name: Pandoc AST fixtures (JSON on disk, no live pandoc)
        run: cargo test --features "cli,pandoc" --test pandoc_ast_backend -- --nocapture

      - name: Colink opt-in without archive fails closed
        run: |
          set +e
          rm -f native/snapper-pandoc/lib/libsnapper_pandoc.a \
                native/snapper-pandoc/static-build/libsnapper_pandoc.a
          out=$(cargo build --features "cli,pandoc,pandoc-colink" --bin snapper 2>&1)
          ec=$?
          set -e
          echo "$out" | tail -50
          test "$ec" -ne 0
          echo "$out" | grep -E "libsnapper_pandoc\.a|static build product"

      - name: Dogfood snapper --check on docs and examples
        run: |
          cargo build --quiet --bin snapper
          ./target/debug/snapper --check --format org readme_src.org docs/orgmode/**/*.org examples/paper.org
          ./target/debug/snapper --check --format plaintext examples/basic.txt
          ./target/debug/snapper --check --format markdown examples/paper.md
          ./target/debug/snapper --check --format latex examples/paper.tex
