# rattler-build / conda-forge style recipe for snapper-fmt (binary: snapper).
# Submit via conda-forge/staged-recipes after `rattler-build build`.
context:
  version: "0.7.7"

package:
  name: snapper-fmt
  version: ${{ version }}

source:
  url: https://github.com/TurtleTech-ehf/snapper/archive/refs/tags/v${{ version }}.tar.gz
  # sha256: fill on release

build:
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - cargo install --locked --root "$PREFIX" --path . --bin snapper
    - rm -f "$PREFIX/.crates.toml" "$PREFIX/.crates2.json"

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - cargo-bundle-licenses
  host: []
  run: []

tests:
  - script:
      - snapper --version
      - snapper --help

about:
  home: https://snapper.turtletech.us
  license: MIT
  license_file: LICENSE
  summary: Semantic line break formatter for Org, LaTeX, Markdown, and plaintext
  description: |
    Snapper reformats prose so each sentence sits on its own line (semantic line breaks),
    preserving markup structure for Org, LaTeX, Markdown, RST, and plaintext.
  repository: https://github.com/TurtleTech-ehf/snapper

extra:
  recipe-maintainers:
    - HaoZeke
